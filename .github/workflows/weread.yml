name: weread note sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
concurrency:
  group: weread-notion-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
      CC_URL: ${{ secrets.CC_URL }}
      CC_ID: ${{ secrets.CC_ID }}
      CC_PASSWORD: ${{ secrets.CC_PASSWORD }}
      BOOK_DATABASE_NAME: ${{ vars.BOOK_DATABASE_NAME }}
      AUTHOR_DATABASE_NAME: ${{ vars.AUTHOR_DATABASE_NAME }}
      CATEGORY_DATABASE_NAME: ${{ vars.CATEGORY_DATABASE_NAME }}
      BOOKMARK_DATABASE_NAME: ${{ vars.BOOKMARK_DATABASE_NAME }}
      REVIEW_DATABASE_NAME: ${{ vars.REVIEW_DATABASE_NAME }}
      CHAPTER_DATABASE_NAME: ${{ vars.CHAPTER_DATABASE_NAME }}
      YEAR_DATABASE_NAME: ${{ vars.YEAR_DATABASE_NAME }}
      WEEK_DATABASE_NAME: ${{ vars.WEEK_DATABASE_NAME }}
      MONTH_DATABASE_NAME: ${{ vars.MONTH_DATABASE_NAME }}
      DAY_DATABASE_NAME: ${{ vars.DAY_DATABASE_NAME }}
      REF: ${{ github.ref }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check sync configuration
        shell: bash
        run: |
          if [[ -z "${NOTION_TOKEN:-}" || -z "${NOTION_PAGE:-}" ]]; then
            echo "::error::NOTION_TOKEN or NOTION_PAGE is missing. Check repository Actions secrets."
            exit 1
          fi
          if [[ -z "${WEREAD_COOKIE:-}" && ( -z "${CC_ID:-}" || -z "${CC_PASSWORD:-}" ) ]]; then
            echo "::error::Set WEREAD_COOKIE or a complete CookieCloud CC_ID/CC_PASSWORD pair."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify legacy Notion API compatibility
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from notion_client import Client
          notion = Client(auth='preflight-nonsecret-token')
          assert hasattr(notion.databases, 'query'), 'Expected legacy databases.query; check notion-client pin'
          print('SDK compatibility OK: notion-client', version('notion-client'), 'weread2notionpro', version('weread2notionpro'))
          PY
      - name: weread book sync
        run: |
          book
      - name: weread sync
        run: |
          weread
      
